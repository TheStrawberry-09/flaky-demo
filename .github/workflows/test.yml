name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - run: ./gradlew test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results/test/*.xml